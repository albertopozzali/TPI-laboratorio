<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Acquisto</title>
    <script src="script.js" defer></script>
</head>
<body>
 
    <form id="formAcquisto">
        <label for="prodotto">Prodotto:</label>
        <input type="text" id="prodotto">
 
        <br><br>      
 
 
        <label for="prezzo">Prezzo:</label>
        <input type="number" id="prezzo">
 
        <br><br>
 
   
        <label for="quantita">Quantita':</label>
        <input type="number" id="quantita">
 
        <br><br>
        <button type="submit"> Calcola</button>
        <button type="button" id="bottoneEliminaTutto"> Elimina Tutto</button>
    </form>
    <h3>Prodotti inseriti: </h3>
 
    <table border="1">
        <thead>
            <tr>
                <th>Prodotto</th>
                <th>Prezzo</th>
                <th>Quantità</th>
                <th>Subtotale</th>
                <th>Sconto</th>
                <th>Totale</th>
            </tr>
        </thead>
 
        <tbody id="tabellaFeedback">
        </tbody>
    </table>
    <h3 id="totComplessivo"></h3>
</body>
</html>
